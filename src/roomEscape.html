<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style></style>
    <script
      src="https://code.jquery.com/jquery-4.0.0.min.js"
      integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main class="RoomMainBox">
      <div class="RoomGameArea">
        <picture>
          <!-- <source media="(max-width: 768px)" srcset="/room1-mobile.png" /> -->
          <img class="RoomBgImage" src="/room1.png" alt="room" />
        </picture>
      </div>
      <div class="recordNoteIcon">
        <img src="/recordNoteIcon.png" alt="record note" />
      </div>
      <div class="inventoryIcon">
        <img src="/inventoryIcon.png" alt="inventory" />
      </div>
      <div class="recordNoteBook">
        <div class="recordNoteBookContent">
          <div class="cotentBox">
            <div class="left_content"></div>
            <div class="right_content"></div>
          </div>
          <div class="arrowBox">
            <div class="left_Arrow">
              <img src="/rightArrow.png" alt="left arrow" />
            </div>
            <div class="right_Arrow">
              <img src="/rightArrow.png" alt="right arrow" />
            </div>
          </div>
        </div>
      </div>
      <div class="prevStaveBtn">
        <img src="/prevStage.png" alt="previous stage button" />
      </div>
      <div class="inventory">
        <div class="inventoryArea">
          <div class="inventoryBox"></div>
        </div>
      </div>
      <div class="CharaterTextBox"><p class="CharaterText"></p></div>
    </main>
    <script type="module" src="/src/scripts/roomEscape/main.ts"></script>
  </body>
</html>
